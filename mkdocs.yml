site_name: yubivault
site_description: Log in to HashiCorp Vault or OpenBao with TLS certificate auth from a YubiKey, or from local files, and print the token.
site_url: https://fatred.github.io/yubivault/
repo_url: https://github.com/fatred/yubivault
repo_name: fatred/yubivault
edit_uri: edit/main/docs/

# docs_dir is the only content root, so the repo root (README.md) and
# audit-context/ are never copied into the published site.
docs_dir: docs

# Build tooling that lives in docs/ but is not documentation.
exclude_docs: |
  requirements.txt
  requirements.in

# Make `mkdocs build --strict` fail on omitted pages, broken links and broken anchors.
validation:
  nav: {omitted_files: warn, not_found: warn, absolute_links: warn}
  links: {not_found: warn, absolute_links: warn, unrecognized_links: warn}
  anchors: warn

# The built-in plain theme: no external theme, plugin or JS dependency.
theme:
  name: mkdocs

nav:
  - Overview: index.md
  - Install: install.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - PKI setup (CA, YubiKey, Vault): pki-setup.md
  - Maintainer guide:
      - Architecture: maintainers/architecture.md
      - Development and tests: maintainers/development.md
      - Release: maintainers/release.md
      - Enable GitHub Pages: maintainers/pages-runbook.md
  - Agent instructions: agents.md
