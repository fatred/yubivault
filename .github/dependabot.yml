version: 2
updates:
  # GitHub Actions in .github/workflows, including the SHA pins (Dependabot
  # updates the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # Go modules in go.mod, including the govulncheck tool dependency.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      go-modules:
        patterns: ["*"]

  # MkDocs and its transitive packages, pinned with hashes in docs/requirements.txt.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      docs-python:
        patterns: ["*"]
