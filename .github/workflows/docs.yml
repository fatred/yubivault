name: Docs

# Read-only for every job; the deploy job grants itself the two write scopes
# Pages needs, so a pull request can never publish.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

# Serialize runs per ref. Main deployments cannot race each other; pull requests
# do not queue behind or cancel main's deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) keeps the pins current.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs dependencies
        run: pip install --require-hashes -r docs/requirements.txt
      # --strict turns every MkDocs warning (broken relative link, page missing
      # from the nav) into a failure, on pull requests as well as main.
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload Pages artifact
        # Only the revision that will be deployed needs the artifact.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # Push to main only: no deploy from a pull request or any other ref.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
