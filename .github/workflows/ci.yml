name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    # Run on all pull requests (no branch filter)
  schedule:
    # Weekly, so newly published advisories are caught without a code change.
    - cron: '17 6 * * 1'

# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) keeps the pins current.
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; it also proves the darwin/arm64
        # release build, which needs cgo (miekg/pkcs11) and so cannot be
        # cross-compiled from Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        # Caches the module and build caches keyed on go.sum by default.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      # govulncheck is a tool dependency in go.mod, so its version is pinned
      # and updated by Dependabot. It fails when the code calls a vulnerable
      # function in a dependency or the standard library.
      - name: govulncheck
        run: go tool govulncheck ./...
